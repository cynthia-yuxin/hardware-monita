<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sakura NVIDIA Monitor</title><style>
:root{--glass:.75;--scene:.93;--ink:#4a303f;--rose:#a53f72;font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);font-size:16px;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4d9e4}body:before{content:"";position:fixed;inset:0;background:url('/background.png') 68% center/cover;opacity:var(--scene);z-index:-1}main{max-width:1050px;margin:auto;padding:24px 20px calc(28px + env(safe-area-inset-bottom))}h1,h2,h3,p{margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font-size:.75rem;letter-spacing:.18em;color:#925773;margin-bottom:6px}h1{font-size:1.7rem;letter-spacing:-.035em}header small{display:block;font-size:.82rem;margin-top:7px}.flower{font-size:2.8rem;color:#b65282;text-shadow:0 3px 0 #fff8}.glass{background:rgb(255 248 251 / var(--glass));border:1px solid #fffd;border-radius:20px;box-shadow:0 5px 18px #63344b0b}.intro{padding:15px}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 15px;margin-bottom:12px}.controls label{display:flex;align-items:center;gap:8px;font-size:.875rem}input[type=range]{width:100px;accent-color:#b86692;min-height:34px}button{font:inherit;border:0;background:#ead0df;border-radius:12px;color:#613f54;padding:10px 14px;min-height:44px;cursor:pointer}.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.status article{padding:13px;border-radius:16px}.status h3{font-size:.875rem;margin-bottom:6px}.status p{font-size:.875rem;font-weight:bold;color:#31614f}.status small{display:block;font-size:.75rem;margin-top:5px;color:#75566a}.bad{color:#a62450!important}.muted{color:#765b6b}.alert{padding:14px 16px;margin:12px 0;background:rgb(255 241 247 / var(--glass));border:1px solid #ca7d9d66}.alert.firing{background:rgb(249 204 221 / var(--glass));border-color:#c15e89}.alert h2{font-size:1rem;margin-bottom:7px}.alert p{font-size:.875rem;line-height:1.6;overflow-wrap:anywhere}section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding:8px 12px;border-radius:12px}h2{font-size:1.12rem}.node-meta{font-size:.875rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gpu{padding:17px;min-width:0}.gpu h3{font-size:.95rem;color:#884063;font-weight:500}.memory-label{font-size:.875rem;color:#79586b;margin-top:12px}.memory{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-top:2px}.memory strong{font-size:2.05rem;letter-spacing:-.03em;color:var(--rose)}.memory small{font-size:.85rem;color:#735268}.memory .percent{margin-left:auto;font-size:1.1rem;color:var(--rose)}.bar{height:7px;background:#eed9e4;border-radius:8px;overflow:hidden;margin:9px 0 14px}.bar span{display:block;height:100%;background:#c674a0;border-radius:8px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metrics dt{font-size:.8rem;color:#705268}.metrics dd{font-size:1.06rem;margin:5px 0 0}.apps{list-style:none;margin:14px 0 0;padding:10px 0 0;border-top:1px solid #b9809c44;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}.apps li{font-size:.875rem;overflow-wrap:anywhere}.apps small{display:block;color:#795c6d;font-size:.75rem;margin-top:3px}.laptop{padding:17px}.laptop h3{margin-bottom:10px}.laptop .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.battery{margin-top:15px;font-size:.95rem;line-height:1.8}.stale{font-size:.875rem;color:#9e3358;margin:5px 0}.foot{margin-top:22px;font-size:.75rem;line-height:1.7;padding:12px}.offline{padding:20px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:4px}
@media(max-width:600px){main{padding:16px 12px calc(22px + env(safe-area-inset-bottom))}h1{font-size:1.45rem}.flower{font-size:2.3rem}.grid{grid-template-columns:1fr}.sectionhead{align-items:flex-start;flex-direction:column;gap:5px}.status{gap:6px}.status article{padding:10px 8px}.status h3{font-size:.8rem}.status small{font-size:.75rem}.controls{padding:6px 12px}.node-meta{font-size:.875rem}.gpu{padding:16px}.gpu h3{font-size:1rem}.memory strong{font-size:2.25rem}header small{font-size:.75rem}.apps{gap:10px}.intro{padding:12px}.foot{font-size:.75rem}}
@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.97)}}
.welcome{padding:12px;gap:8px}.welcome .intro{flex:1;min-width:0}.welcome h1 span{display:block}.welcome h1{max-width:18em;line-height:1.4;margin-top:10px}.owner-label{display:inline-block;color:#914d70;font-size:.75rem;background:#f4dce8;padding:5px 9px;border-radius:20px}.portrait{display:block;flex:none;width:145px;line-height:0;border:3px solid #fff9;border-radius:70px 70px 22px 22px;overflow:hidden;box-shadow:0 4px 16px #a95a8520}.portrait img{display:block;width:100%;height:auto}@media(max-width:600px){.welcome{padding:8px;gap:2px}.welcome .intro{padding:8px}.welcome h1{font-size:1.35rem}.welcome .eyebrow{font-size:.6rem;letter-spacing:.1em}.portrait{width:36%;max-width:145px}.welcome small{line-height:1.7}}
</style></head><body><main>
<header class="glass intro"><div><p class="eyebrow">SAKURA / LAN OBSERVATORY</p><h1>樱花 · 显卡观察室</h1><small>♡ 每一张显卡，都好好照看</small></div></header>
<div class="glass controls"><label for="opacity">透明度 <input id="opacity" type="range" min="0.65" max="1" step="0.01" value="0.93"></label><button id="refresh">↻ 刷新</button></div>
<aside class="glass intro" id="summary" aria-live="polite">正在发现已开启采集器的 NVIDIA 主机…</aside>
<div id="hosts"></div><footer class="glass foot" id="footer">仅显示已响应的 NVIDIA 采集器 · 不代表局域网全部物理设备</footer>
</main><script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,s='')=>typeof x==='number'&&Number.isFinite(x)?`${Number(x.toFixed(1))}${s}`:'—';
const gib=x=>typeof x==='number'?`${(x/1024).toFixed(1)} GiB`:'—';
const metric=(label,value)=>`<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`;

function appName(name){return String(name).replaceAll('\\','/').split('/').pop()}
function gpu(g,host){const pct=g.total>0&&g.used!=null?g.used/g.total*100:null;return `<article class="glass gpu"><h3>GPU ${esc(g.index)} / ${esc(g.name.replace(/NVIDIA GeForce |NVIDIA /g,''))}</h3><p class="memory-label">显存占用</p><div class="memory"><strong>${gib(g.used)}</strong><small>/ ${gib(g.total)}</small><span class="percent">${num(pct,'%')}</span></div><div class="bar"><span style="width:${pct==null?0:Math.min(100,Math.max(0,pct))}%"></span></div><dl class="metrics">${metric('GPU 利用率',num(g.util,'%'))}${metric('温度',num(g.temp,'°C'))}${metric('功率',num(g.power,' W'))}</dl><ul class="apps">${(g.apps||[]).map(a=>`<li>${esc(appName(a.name))}<small>PID ${esc(a.pid)} · ${num(a.memory,' MiB')}</small></li>`).join('')||'<li>暂无应用</li>'}</ul>${host.apps_ok===false?'<p class="stale">应用信息采集失败</p>':''}${host.graphics_ok===false?'<p class="stale">图形应用状态未知</p>':''}</article>`}

let busy=false;
async function refresh(){
 if(busy)return;busy=true;
 try{
  const response=await fetch('/api/snapshot',{cache:'no-store',signal:AbortSignal.timeout(6000)});
  if(!response.ok)throw Error();
  const data=await response.json(),hosts=data.hosts||[];
  const stale=Date.now()/1000-data.timestamp>35;
  $('summary').textContent=`${stale?'等待新数据 · ':''}发现 ${hosts.length} 台 NVIDIA 主机 · ${hosts.reduce((sum,h)=>sum+h.gpus.length,0)} 张显卡`;
  $('hosts').innerHTML=hosts.map(h=>`<section><div class="glass sectionhead"><h2>♡ ${esc(h.hostname||h.address)}</h2><p>${esc(h.address)}</p><p class="node-meta">CPU ${num(h.cpu,'%')} · 内存 ${num(h.memory,'%')} / ${num(h.ram_gb,' GB')}</p></div>${Date.now()/1000-h.timestamp>25?'<p class="glass stale">主机采样已过期，以下为历史数据</p>':''}<div class="grid">${h.gpus.map(g=>gpu(g,h)).join('')}</div></section>`).join('');
  if(!hosts.length)$('hosts').innerHTML='<section class="glass intro">尚未发现 NVIDIA 设备。请确认采集器已启动、子网正确且防火墙允许采集端口。</section>';
  $('footer').textContent=`${data.timestamp?'最近发现 '+new Date(data.timestamp*1000).toLocaleTimeString():'等待首次扫描'} · 仅显示已响应的 NVIDIA 采集器 · 未响应不等于没有显卡${data.error?' · '+data.error:''}`;
 }catch{$('summary').textContent='暂时连接不上监控服务；以下为上次数据，正在重试。'}finally{busy=false}
}
$('opacity').addEventListener('input',e=>{const v=Number(e.target.value);document.documentElement.style.setProperty('--scene',v);document.documentElement.style.setProperty('--glass',.75*v/.93)});
$('refresh').addEventListener('click',refresh);setInterval(()=>{if(!document.hidden)refresh()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});refresh();
</script></body></html>
